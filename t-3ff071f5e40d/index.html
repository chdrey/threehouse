<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Trader</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0e131a;--card:#171e28;--card2:#1e2733;--line:#2a3544;--tx:#e8edf3;--mut:#8b98a9;--up:#3cd282;--dn:#ff6b6b;--acc:#6aa8ff;--warn:#f5b84b}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--card:#fff;--card2:#eef1f5;--line:#dbe1e9;--tx:#16202c;--mut:#5d6b7c;--up:#0f9d58;--dn:#d93025;--acc:#1a64d6;--warn:#b26a00}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
 padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));min-height:100dvh}
button,input{font:inherit;color:inherit}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.banner{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{min-height:44px;min-width:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;padding:0 4px}
section{display:flex;flex-direction:column;gap:8px}
/* lock */
#lock{display:flex;flex-direction:column;gap:16px;justify-content:center;min-height:70dvh}
#lock h1{font-size:28px}
#lock input[type=password]{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);width:100%}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;color:var(--mut)}
.chk input{width:24px;height:24px}
#err{color:var(--dn);min-height:20px;font-size:14px}
/* hero */
.hero{display:flex;flex-direction:column;gap:8px}
.big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;background:var(--card2);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.badge.open{color:var(--up)}.badge.premarket,.badge.afterhours{color:var(--warn)}.badge.halt{color:#fff;background:var(--dn)}
.tools{display:flex;gap:8px}
/* accounts */
.acct{display:flex;flex-direction:column;gap:12px}
.acct.shadow{opacity:.85;border-style:dashed}
.eq{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:14px}
.stats div:first-child{grid-column:1/-1}.stats div{display:flex;justify-content:space-between;gap:8px}
svg.spark{width:100%;height:48px;display:block}
.name{font-weight:600}
/* lists */
.item{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}.item:last-child{padding-bottom:0}
.sym{font-weight:700}.sub{font-size:13px;color:var(--mut)}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
details.card summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;font-weight:600}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--mut);font-size:20px}
details[open] summary::after{content:"\2212"}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--mut);font-weight:600;text-align:right;padding:8px 4px}.tbl td{text-align:right;padding:8px 4px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.scroll{overflow-x:auto}
.empty{color:var(--mut);font-size:14px;padding:4px}
.ab{display:grid;grid-template-columns:1fr auto auto;gap:4px 16px;font-size:14px;align-items:center}
.foot{text-align:center;font-size:12px;color:var(--mut)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
 <div class="banner">Paper trading &middot; fake money</div>

 <form id="lock" hidden autocomplete="off">
  <h1>Paper Trader</h1>
  <p class="mut">Private dashboard. Enter your passphrase to decrypt today's numbers.</p>
  <input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password" aria-label="Passphrase">
  <label class="chk"><input id="rem" type="checkbox"> Remember on this phone</label>
  <div id="err" role="alert"></div>
  <button class="btn pri" type="submit">Unlock</button>
 </form>

 <main id="app" hidden>
  <div class="wrap" id="dash"></div>
 </main>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=(n,d=2)=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=n=>n>0?'+':n<0?'-':'';
const money=n=>sgn(n)+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>sgn(n)+Math.abs(n).toFixed(2)+'%';
const cls=n=>n>0?'up':n<0?'dn':'mut';
const num=n=>typeof n==='number'&&isFinite(n);
let ENC=null, DATA=null, PASS=null;

async function decrypt(enc,pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.salt),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.iv)},key,b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function load(){
  const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
function showLock(msg){$('#app').hidden=true;$('#lock').hidden=false;$('#err').textContent=msg||'';$('#pw').value='';}
async function unlock(pass,remember,silent){
  try{
    ENC=await load();
  }catch(e){showLock("Couldn't load the data file. Check your connection and try again.");return}
  try{
    DATA=await decrypt(ENC,pass);
  }catch(e){
    if(silent)LS.del('pt_pass');
    showLock(silent?'Saved passphrase no longer works. Enter it again.':'Wrong passphrase. Try again.');return;
  }
  PASS=pass;if(remember)LS.set('pt_pass',pass);
  $('#lock').hidden=true;$('#app').hidden=false;render();
}
$('#lock').addEventListener('submit',async e=>{
  e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='Unlocking…';
  $('#err').textContent='';
  await unlock($('#pw').value,$('#rem').checked,false);
  b.disabled=false;b.textContent='Unlock';
});
function forget(){LS.del('pt_pass');DATA=null;PASS=null;showLock('');}
async function refresh(btn){
  const p=PASS||LS.get('pt_pass');
  if(btn){btn.disabled=true;btn.textContent='…';}
  if(p)await unlock(p,!!LS.get('pt_pass'),true);else showLock('Enter your passphrase.');
}

function spark(curve,up){
  if(!Array.isArray(curve)||curve.length<2)return '';
  const v=curve.map(p=>p.eq),mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1,W=300,H=48;
  const pts=v.map((y,i)=>[(i/(v.length-1))*W,H-4-((y-mn)/rg)*(H-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const col=up?'var(--up)':'var(--dn)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Equity curve"><path d="${d} L${W} ${H} L0 ${H} Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
const isShadow=a=>a.shadow===true||String(a.id).includes('+');
const label=(accts,id)=>(accts.find(a=>a.id===id)||{}).label||id;
function fmtTime(iso){const d=new Date(iso);if(isNaN(d))return esc(iso||'');return d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}

function tradeRow(t,accts){
  return `<div class="item"><div class="row"><div><span class="sym">${esc(t.symbol)}</span> <span class="sub">${esc(t.side)} ${esc(t.qty)} &middot; ${esc(label(accts,t.account))}</span></div>
  <div class="num ${cls(t.pnl)}">${money(t.pnl)}<div class="sub ${cls(t.pnl)}">${pct(t.pnl_pct)}${num(t.r)?' &middot; '+t.r+'R':''}</div></div></div>
  <div class="sub">${usd(t.entry)} &rarr; ${usd(t.exit)} &middot; ${fmtTime(t.time)}${t.reason?' &middot; '+esc(t.reason):''}</div></div>`;
}

function render(){
  const D=DATA,A=D.accounts||[];
  const real=A.filter(a=>!isShadow(a)&&a.id!==(D.benchmark||{}).id&&a.id!=='voo_hold');
  const day=real.reduce((s,a)=>s+(a.day_pnl||0),0);
  const start=real.reduce((s,a)=>s+(a.start||0),0);
  const tot=real.reduce((s,a)=>s+(a.total_pnl||0),0);
  const totPct=start?tot/start*100:0;
  const voo=num((D.benchmark||{}).total_pnl_pct)?D.benchmark.total_pnl_pct:null;
  const ms=D.market_status||'closed';
  const anyHalt=A.some(a=>a.halted&&!isShadow(a));
  let h='';
  h+=`<div class="card hero">
   <div class="row"><span class="mut">Today (fake money)</span><span class="badge ${esc(ms)}">${esc(ms)}</span></div>
   <div class="big ${cls(day)}">${money(day)}</div>
   <div class="row"><span class="mut">Since start</span><span class="num ${cls(totPct)}">${pct(totPct)}</span></div>
   ${voo!==null?`<div class="row"><span class="mut">vs VOO (${pct(voo)})</span><span class="num ${cls(totPct-voo)}">${totPct-voo>=0?'beating by ':'behind by '}${Math.abs(totPct-voo).toFixed(2)} pts</span></div>`:''}
   ${anyHalt?'<div><span class="badge halt">Some strategy halted</span></div>':''}
   <div class="row"><span class="sub">Updated ${fmtTime(D.generated)}</span>
    <span class="tools"><button class="btn" id="bref" aria-label="Refresh">&#8635;</button><button class="btn" id="block" aria-label="Lock and forget passphrase">Lock</button></span></div>
  </div>`;

  h+=`<section><h2>Accounts</h2>`+A.map(a=>`<div class="card acct${isShadow(a)?' shadow':''}">
    <div class="row"><span class="name">${esc(a.label||a.id)}</span>${a.halted?'<span class="badge halt">HALTED</span>':isShadow(a)?'<span class="badge">shadow</span>':''}</div>
    <div class="row"><span class="eq">${usd(a.equity)}</span><span class="num ${cls(a.day_pnl)}">${money(a.day_pnl||0)}<div class="sub ${cls(a.day_pnl)}">${num(a.day_pnl_pct)?pct(a.day_pnl_pct):''} today</div></span></div>
    ${spark(a.equity_curve,(a.total_pnl||0)>=0)}
    <div class="stats"><div><span class="mut">Total</span><span class="${cls(a.total_pnl)}">${money(a.total_pnl||0)} (${num(a.total_pnl_pct)?pct(a.total_pnl_pct):'-'})</span></div>
     <div><span class="mut">Win rate</span><span>${num(a.win_rate)?Math.round(a.win_rate*100)+'%':'-'}</span></div>
     <div><span class="mut">Trades</span><span>${esc(a.trades??'-')}</span></div>
     <div><span class="mut">Max DD</span><span class="dn">${num(a.max_drawdown_pct)?a.max_drawdown_pct.toFixed(1)+'%':'-'}</span></div></div>
  </div>`).join('')+`</section>`;

  const op=D.open_positions||[];
  h+=`<section><h2>Open positions</h2><div class="card">${op.length?op.map(p=>`<div class="item"><div class="row"><div><span class="sym">${esc(p.symbol)}</span> <span class="sub">${esc(p.qty)} @ ${usd(p.entry)} &middot; ${esc(label(A,p.account))}</span></div>
   <div class="num ${cls(p.pnl)}">${money(p.pnl)}<div class="sub ${cls(p.pnl)}">${pct(p.pnl_pct)}</div></div></div>
   <div class="sub">Last ${usd(p.last)}${num(p.stop)?' &middot; stop '+usd(p.stop):''}${num(p.target)?' &middot; target '+usd(p.target):''} &middot; since ${esc(p.opened)}${p.reason?' &middot; '+esc(p.reason):''}</div></div>`).join(''):'<div class="empty">No open positions.</div>'}</div></section>`;

  const tt=D.today_trades||[];
  h+=`<section><h2>Today's trades</h2><div class="card">${tt.length?tt.map(t=>tradeRow(t,A)).join(''):'<div class="empty">No closed trades today.</div>'}</div></section>`;

  const ab=D.council_ab;
  if(ab&&ab.pairs&&ab.pairs.length)h+=`<section><h2>Council A/B</h2><div class="card"><p class="sub" style="margin-bottom:12px">${esc(ab.note||'')}</p><div class="ab"><span class="sub">Strategy</span><span class="sub num">Base</span><span class="sub num">+Council</span>`+
   ab.pairs.map(p=>`<span>${esc(label(A,p.base))}</span><span class="num ${cls(p.base_pct)}">${pct(p.base_pct)}</span><span class="num ${cls(p.with_pct)}">${pct(p.with_pct)}</span>`).join('')+`</div></div></section>`;

  const rt=D.recent_trades||[];
  h+=`<details class="card"><summary>Recent trades (${rt.length})</summary><div style="margin-top:12px">${rt.map(t=>tradeRow(t,A)).join('')||'<div class="empty">None yet.</div>'}</div></details>`;
  const bt=D.backtest;
  if(bt&&bt.rows)h+=`<details class="card"><summary>Backtest (${esc(bt.date||'')})</summary><div class="scroll" style="margin-top:8px"><table class="tbl"><tr><th>Strategy</th><th>Trades</th><th>Win</th><th>Return</th><th>Max DD</th><th>VOO</th></tr>`+
   bt.rows.map(r=>`<tr><td>${esc(r.strategy)}</td><td>${esc(r.trades)}</td><td>${num(r.win_rate)?Math.round(r.win_rate*100)+'%':'-'}</td><td class="${cls(r.total_return_pct)}">${pct(r.total_return_pct)}</td><td class="dn">${num(r.max_dd_pct)?r.max_dd_pct.toFixed(1)+'%':'-'}</td><td class="${cls(r.voo_pct)}">${num(r.voo_pct)?pct(r.voo_pct):'-'}</td></tr>`).join('')+`</table></div></details>`;
  h+=`<div class="foot">Paper trading &middot; fake money &middot; not financial advice</div>`;
  $('#dash').innerHTML=h;
  $('#bref').onclick=e=>refresh(e.currentTarget);
  $('#block').onclick=forget;
}
// refresh without remembered pass: re-fetch and decrypt with in-memory pass
(function(){
  const p=LS.get('pt_pass');
  if(p){$('#rem').checked=true;unlock(p,true,true)}else showLock('');
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DATA&&PASS)unlock(PASS,!!LS.get('pt_pass'),true)});
})();
</script>
</body>
</html>
